name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/car-sales-handoff-sht2ks' # 開發分支
    # 本 repo（leoliaoinfo-cpu/car）為汽車銷售業務系統專屬，
    # Pages 網址獨立，不會與舊 TEST repo 的系統互相覆蓋。
    paths:
      - 'assistant/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assistant/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: assistant

      - name: Build
        run: npm run build
        working-directory: assistant

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: assistant/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
