<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汽車銷售業務系統</title>
    <script>
      // 在 React 載入前套用主題，避免閃色（預設深色）
      try {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      body { background: #ecf0f3; }
      html.dark body { background: #171c21; }
    </style>
    <!-- 刻意不載入任何外部字體：改用裝置內建繁中字體（見 index.css / tailwind.config.js），
         零網路下載、打開即顯示，離線也完全可用。 -->
  </head>
  <body class="bg-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
